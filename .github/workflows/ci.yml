name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ts-check:
    name: "TS: typecheck + vitest (@bmsuisse/ui, @bmsuisse/datagrid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  python-check:
    name: "Python: ruff + ty + pytest (bmsdna-datagrid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: python/datagrid
        run: |
          uv sync --all-extras --all-groups
          uv run ruff check .
          uv run ty check .
          uv run pytest

  e2e:
    name: "Playwright e2e (SQLite + real Meilisearch binary)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v3
      - run: bun install --frozen-lockfile
      - working-directory: e2e/server
        run: uv sync --all-extras --all-groups
      - working-directory: packages/datagrid
        run: bunx playwright install --with-deps chromium
      - working-directory: packages/datagrid
        run: bun run e2e
        env:
          CI: "true"
