name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ts-check:
    name: "TS: typecheck + vitest (@bmsuisse/ui, @bmsuisse/datagrid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: "API report is up to date (packages/*/api-report.md)"
        run: |
          bun run build
          bun run api-report
          if ! git diff --exit-code packages/*/api-report.md; then
            echo "::error::The public API changed but packages/*/api-report.md was not regenerated. Run 'bun run build && bun run api-report' and commit the updated report(s)."
            exit 1
          fi

  python-check:
    name: "Python: ruff + ty + pytest (bmsdna-datagrid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: python/datagrid
        run: |
          uv sync --all-extras --all-groups
          uv run ruff check .
          uv run ty check .
          uv run pytest

  e2e:
    name: "Playwright e2e (SQLite + real Meilisearch binary)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v3
      - run: bun install --frozen-lockfile
      - working-directory: e2e/server
        run: uv sync --all-extras --all-groups
      - working-directory: packages/datagrid
        run: bunx playwright install --with-deps chromium
      - working-directory: packages/datagrid
        run: bun run e2e
        env:
          CI: "true"

  storybook:
    name: "Storybook: every story renders in light + dark, visual diff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - working-directory: packages/ui
        run: bunx playwright install --with-deps chromium
      - working-directory: packages/ui
        run: bun run build-storybook
      - name: Smoke + visual diff (smoke only until baselines are committed)
        working-directory: packages/ui
        run: |
          if [ -d visual/baselines ]; then
            bun run test:visual
          else
            echo "::notice::No visual baselines yet (run the 'Update visual baselines' workflow); running the render check only."
            SMOKE_ONLY=1 bun run test:visual
          fi
        env:
          CI: "true"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-report
          path: |
            packages/ui/visual/report
            packages/ui/test-results
          if-no-files-found: ignore
