[project]
name = "datagrid-e2e-server"
version = "0.1.0"
description = "FastAPI harness exercising bmsdna-datagrid against SQLite and Meilisearch, driven by the Playwright suite in packages/datagrid/e2e."
requires-python = ">=3.11"
dependencies = [
    "bmsdna-datagrid",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "meilisearch>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17",
    "ty>=0.0.100",
]

[tool.uv]
exclude-newer = "5 days"
exclude-newer-package = { bmsdna-datagrid = false }
# This is a standalone FastAPI app (`uv run uvicorn main:app`), not a library
# meant to be built/installed as a package itself — only its dependencies
# (notably the local bmsdna-datagrid path dependency below) matter.
package = false

[tool.uv.sources]
bmsdna-datagrid = { path = "../../python/datagrid", editable = true }

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = ["*.md", ".worktrees", ".claude"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pycodestyle, pyflakes, isort
    "UP",            # pyupgrade - X | None, modern syntax
    "B",             # bugbear - mutable defaults etc.
    "ANN",           # full type annotations
    "SIM", "C4",     # simplifiable code, needless comprehensions/casts
    "PERF", "FURB",  # needless loops, manual list/dict building
    "ASYNC",         # blocking calls inside async def
    "FAST",          # FastAPI: Annotated deps, redundant response_model
    "RUF",
    "N",             # PEP 8 naming
    "PTH",           # pathlib instead of os.path
    "TID",           # absolute imports only, banned APIs
    "RET", "PIE",    # consistent returns, misc simplifications
    "A",             # no shadowing builtins
    "T20",           # no print()
    "LOG",           # logging API misuse
    "DTZ",           # timezone-aware datetimes
    "FLY",           # f-string instead of str.join on literals
    "PLE", "PLW",    # pylint errors + warnings
]
ignore = ["ANN401"]  # `Any` is a warning via the ruff-warn-any prek hook, not an error

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = [".worktrees", ".claude"]
